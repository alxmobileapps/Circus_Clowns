<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1c0a33" />
  <title>Circus Clown</title>
  <style>
    :root { --ad-h: 0px; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #1c0a33;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Portrait game frame: full screen on phones, phone-shaped on wide screens */
    canvas {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: var(--ad-h);
      height: calc(100vh - var(--ad-h));
      width: min(100vw, calc((100vh - var(--ad-h)) * 0.6));
      display: block;
    }
    #adph {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      height: var(--ad-h); width: min(100vw, calc((100vh - var(--ad-h)) * 0.6));
      display: flex; align-items: center; justify-content: center;
      background: #d9d4d6; color: #5a4a50; font: 600 13px system-ui, sans-serif;
    }
    #adph[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="adph" hidden>Ad banner (live ads show in the Android app)</div>
  <canvas id="game"></canvas>
  <script src="vendor/capacitor.js"></script>
  <script src="ads-config.js"></script>
  <script src="clowns.js"></script>
  <script src="ads.js"></script>
  <script src="game.js"></script>
</body>
</html>
